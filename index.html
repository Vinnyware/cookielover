<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Lover</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .cookie {
            font-size: 280px;
            line-height: 1;
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s ease;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.5));
        }

        .cookie:hover {
            transform: scale(1.05);
        }

        .cookie.pulse {
            animation: pulse 0.35s ease-out;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.25);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="cookie" id="cookie">🍪</div>

    <script>
        const cookie = document.getElementById("cookie");

        cookie.addEventListener("click", () => {
            cookie.classList.remove("pulse");

            // Restart the animation every click
            void cookie.offsetWidth;

            cookie.classList.add("pulse");
        });
    </script>

</body>
</html>
